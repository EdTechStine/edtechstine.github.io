<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Faktasjekk-stafett grunnskole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: storskjermflate – topplinje, én skjerm om gangen (velg nivå → jakt med klikkbare setninger og klokke → avsløring med fasit) */
:root{
  --bg:#fff6f8; --surface:#ffffff; --tint:#fde3ea; --ink:#3b0b25; --muted:#87506a; --line:#f5c6d4;
  --pink:#ff0a84; --pink-deep:#c8005f; --on-pink:#ffffff; --ok:#13804a;
  --t-fakta:#e6006f; --t-kilde:#7a3fd6; --t-tall:#b86a00; --t-skjev:#0b7f86; --t-sikker:#2f5fd0;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c0a14; --surface:#2a1220; --tint:#3a1a2b; --ink:#ffe8f0; --muted:#d79bb4; --line:#4d2539;
  --pink:#ff4fa3; --pink-deep:#ff7dbb; --on-pink:#1c0a14; --ok:#4fd08a;
  --t-fakta:#ff5fa8; --t-kilde:#b591ff; --t-tall:#f0a940; --t-skjev:#4fd0d6; --t-sikker:#7fa6ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c0a14; --surface:#2a1220; --tint:#3a1a2b; --ink:#ffe8f0; --muted:#d79bb4; --line:#4d2539;
  --pink:#ff4fa3; --pink-deep:#ff7dbb; --on-pink:#1c0a14; --ok:#4fd08a;
  --t-fakta:#ff5fa8; --t-kilde:#b591ff; --t-tall:#f0a940; --t-skjev:#4fd0d6; --t-sikker:#7fa6ff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:18px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px 16px;border-bottom:1px solid var(--line);margin-bottom:28px}
.mark{width:44px;height:44px;border-radius:50%;border:3px solid var(--pink);background:linear-gradient(90deg,var(--surface) 50%,var(--pink) 50%);position:relative;flex:none}
.mark::before,.mark::after{content:"";position:absolute;top:15px;width:8px;height:5px;border-radius:50%}
.mark::before{left:9px;border:1.5px solid var(--pink)} .mark::after{right:9px;background:var(--surface)}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-family:var(--display);font-weight:800;font-size:1.35rem}
.brand span{font-size:.76rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--pink);color:var(--on-pink);border-color:var(--pink)}

h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(2.1rem,5vw,3.6rem);font-weight:800;line-height:1.03}
h1 em{font-style:normal;color:var(--pink)}
h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:800}
h3{font-size:1.12rem;font-weight:600}
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pink-deep);font-weight:700;margin:0 0 6px}
.lede{font-size:1.12rem;max-width:62ch;color:var(--muted)}
.hint{font-size:.9rem;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--pink);color:var(--on-pink);display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--pink-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--pink);background:var(--tint)}
.btn.small{padding:7px 12px;font-size:.92rem;border-radius:9px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* nivåvalg */
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:30px 0}
.level{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:10px;align-content:start;transition:border-color .2s,transform .2s}
.level:hover{border-color:var(--pink);transform:translateY(-2px)}
.level .big{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1}
.level .meta{color:var(--muted)}
.level .go{color:var(--pink-deep);font-weight:700;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1.5px solid var(--c);color:var(--c)}
.c-fakta{--c:var(--t-fakta)} .c-kilde{--c:var(--t-kilde)} .c-tall{--c:var(--t-tall)} .c-skjev{--c:var(--t-skjev)} .c-sikker{--c:var(--t-sikker)}
.why{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;max-width:780px}
.why p{margin:.3em 0}
details.guide{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 22px}
details.guide summary{cursor:pointer;padding:14px 0;font-family:var(--display);font-weight:600;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.guide summary::after{content:"+";color:var(--pink);font-size:1.4rem;line-height:1}
details.guide[open] summary::after{content:"–"}
.gb{padding-bottom:18px;max-width:76ch}
.gb ol,.gb ul{padding-left:1.2em;margin:.4em 0 1em} .gb li{margin:.3em 0}
.km{border-left:4px solid var(--pink);padding:4px 0 4px 14px;margin:8px 0}
.km small{display:block;color:var(--muted);font-size:.82rem;letter-spacing:.04em;text-transform:uppercase}
.prompt{background:var(--tint);border-radius:12px;padding:14px 16px;font-family:var(--mono);font-size:.86rem;white-space:pre-wrap;word-break:break-word;margin:.5em 0}

/* jakt */
.head{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.head > div{min-width:0}
.timer{display:flex;align-items:center;gap:14px}
.ring{width:112px;height:112px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .trk{stroke:var(--tint)} .ring .bar{stroke:var(--pink);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
.ring.low .bar{stroke:var(--t-tall)}
.ring.done .num{color:var(--pink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.timer .ctrl{display:grid;gap:6px}
.teams{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.teams .lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbtn{border:2px solid var(--tc);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.tbtn[aria-pressed="true"]{background:var(--tc);color:#fff}
.tbtn .cnt{font-family:var(--mono);font-size:.82rem}
.ask{max-width:780px;margin-left:auto;background:var(--pink);color:var(--on-pink);padding:12px 16px;border-radius:16px 16px 4px 16px;font-weight:500;width:fit-content}
.answer{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:clamp(18px,3vw,32px);font-size:clamp(1.12rem,1.9vw,1.42rem);line-height:1.75}
.answer .who{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;align-items:center;font-family:var(--body);line-height:1.2}
.answer .who i{width:10px;height:10px;border-radius:50%;background:var(--pink)}
.answer p{margin:0 0 .8em} .answer p:last-child{margin:0}
.s{border-radius:6px;padding:2px 3px;cursor:pointer;transition:background .15s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s:hover{background:var(--tint)}
.s.reading{background:var(--tint);box-shadow:0 0 0 3px var(--pink)}
.ttsrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.s.m{background:color-mix(in srgb,var(--tc) 18%,transparent);box-shadow:inset 0 -3px 0 var(--tc)}
.s .flags{display:inline-flex;gap:2px;margin-left:3px;vertical-align:super}
.s .flags i{width:9px;height:9px;border-radius:50%;display:inline-block}
.answer.reveal .s{cursor:default}
.answer.reveal .s:hover{background:transparent}
.answer.reveal .s.e{cursor:pointer;background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 -3px 0 var(--c)}
.answer.reveal .s.e.active{background:color-mix(in srgb,var(--c) 30%,transparent)}
.answer.reveal .s.fa{text-decoration:line-through dotted var(--muted);text-decoration-thickness:2px}
.answer.reveal sup.n{font-family:var(--mono);font-size:.6em;color:var(--c);margin-left:2px}

/* avsløring */
.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0 4px}
.res{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:12px;padding:14px 16px}
.res b{font-family:var(--display);font-size:1.15rem}
.res .big{font-family:var(--mono);font-size:1.8rem;font-variant-numeric:tabular-nums}
.res span{display:block;color:var(--muted);font-size:.9rem}
.cards{display:grid;gap:12px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:14px 18px}
.card.active{box-shadow:0 0 0 2px var(--c)}
.card .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.card .n{font-family:var(--mono);color:var(--c)}
.card p{margin:.35em 0}
.card .tip{color:var(--muted)} .card .tip b{color:var(--ink)}
.card .who2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:.85rem}
.pill{border-radius:999px;padding:2px 10px;font-weight:600;border:1.5px solid var(--tc);color:var(--tc)}
.pill.miss{border-color:var(--line);color:var(--muted);text-decoration:line-through}
.fa-note{margin-top:16px;padding:12px 16px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted)}
.nextbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.talk{margin-top:28px;max-width:780px}
.talk ol{padding-left:1.2em} .talk li{margin:.45em 0;font-size:1.06rem}

@media (max-width:760px){ .levels{grid-template-columns:1fr} .ring{width:94px;height:94px} .ring .num{font-size:1.3rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="mark" aria-hidden="true"></div>
    <div class="brand"><b>Faktasjekk-stafett</b><span>EdTechStine · grunnskole</span></div>
    <div class="spacer"></div>
    <nav class="steps" aria-label="Fremdrift"><span data-s="start">Velg nivå</span><span data-s="hunt">Jakt</span><span data-s="reveal">Avsløring</span></nav>
  </header>
  <main id="app"></main>
</div>

<script>
(function(){
"use strict";
const TYPES={
  fakta:{label:"Faktafeil",cls:"fakta"},
  kilde:{label:"Oppdiktet kilde eller sitat",cls:"kilde"},
  tall:{label:"Feil tall eller årstall",cls:"tall"},
  skjev:{label:"Skjevhet",cls:"skjev"},
  sikker:{label:"Skråsikker påstand",cls:"sikker"}
};
const TEAMC=["#ff0a84","#7a3fd6","#0b7f86","#d35400","#2f5fd0","#13804a"];
const MAXT=6, newMarks=()=>Array.from({length:MAXT},()=>new Set());

const LEVELS={
 mellom:{
  name:"Mellomtrinnet", grade:"5.–7. trinn", fag:"Naturfag og norsk", title:"Jorda – planeten med liv", minutes:5,
  ask:"Skriv en kort tekst om jorda og verdensrommet for 6. klasse.",
  types:["fakta","kilde","tall"],
  paras:[
   [{t:"Jorda er den tredje planeten fra sola."},
    {t:"Jorda er den eneste planeten vi vet om som har liv."},
    {t:"Det tar jorda ett år å gå én runde rundt sola."}],
   [{t:"Jorda snurrer rundt seg selv én gang i uka.", e:{type:"fakta",
      why:"Jorda snurrer rundt seg selv én gang i døgnet. Det er derfor vi har dag og natt.",
      tip:"Tenk på dag og natt. Hvor ofte blir det mørkt?"}},
    {t:"Mars er den største planeten i solsystemet.", e:{type:"fakta",
      why:"Den største planeten er Jupiter. Mars er faktisk mindre enn jorda.",
      tip:"Sjekk i naturfagboka eller på en plakat av solsystemet."}},
    {t:"Månen lyser fordi sola skinner på den."}],
   [{t:"Neil Armstrong var den første som gikk på månen, i 1979.", e:{type:"tall",
      why:"Månelandingen var i 1969, ti år tidligere.",
      tip:"Årstall er lette å sjekke. Søk på «månelandingen»."}},
    {t:"Professor Lise Romstad sier: «Det bor helt sikkert små dyr på Mars.»", e:{type:"kilde",
      why:"Både professoren og sitatet er diktet opp. Ingen har funnet liv på Mars.",
      tip:"Søk på navnet. Finner du ikke personen, skal du ikke stole på sitatet."}},
    {t:"Sola er en stjerne."}]
  ],
  goals:[
   {fag:"Norsk etter 7. trinn (NOR01-08)", t:"orientere seg i faglige kilder på bibliotek og digitalt, vurdere hvor pålitelige kildene er, og vise til kilder i egne tekster"},
   {fag:"Naturfag etter 7. trinn (NAT01-05)", t:"gjøre rede for forutsetningene jorda har for liv, og sammenligne med andre himmellegemer i universet"},
   {fag:"Naturfag etter 7. trinn (NAT01-05)", t:"beskrive og visualisere hvordan døgn, månefaser og årstider oppstår, og samtale om hvordan dette påvirker livet på jorda"}
  ],
  talk:["Hvilken feil var lettest å finne, og hvorfor?","Hvordan kan en tekst høres riktig ut selv om den er feil?","Hvor kan vi sjekke om noe stemmer? Hvilke kilder stoler dere mest på?","Hva gjør dere neste gang Copilot gir dere et svar til en skoleoppgave?"]
 },
 ungdom:{
  name:"Ungdomsskolen", grade:"8.–10. trinn", fag:"Naturfag og norsk", title:"Drivhuseffekten og klimaendringer", minutes:5,
  ask:"Forklar drivhuseffekten kort for en elev i 9. klasse.",
  types:["fakta","kilde","tall","sikker"],
  paras:[
   [{t:"Drivhuseffekten betyr at gasser i lufta holder på varmen fra jorda."},
    {t:"Uten drivhuseffekten ville det vært mye kaldere på jorda."},
    {t:"CO₂ er den eneste gassen som gir drivhuseffekt.", e:{type:"fakta",
      why:"Også metan, lystgass og vanndamp er drivhusgasser.",
      tip:"Ord som «eneste» bør alltid få deg til å sjekke."}}],
   [{t:"Når vi brenner kull, olje og gass, slipper vi ut mye CO₂."},
    {t:"Parisavtalen om klima ble laget i 1997.", e:{type:"tall",
      why:"Parisavtalen kom i 2015. I 1997 kom en annen avtale, Kyotoprotokollen.",
      tip:"Søk på «Parisavtalen» og sjekk årstallet."}},
    {t:"Jorda har blitt varmere de siste hundre årene."}],
   [{t:"Ifølge Det norske klimainstituttet har Norge halvert utslippene sine.", e:{type:"kilde",
      why:"Instituttet finnes ikke, og Norge har ikke halvert utslippene.",
      tip:"Søk etter instituttet. Ekte utslippstall finner du hos SSB."}},
    {t:"I 2040 vil hele Oslo ligge under vann.", e:{type:"sikker",
      why:"Havet stiger, men ingen forskere sier at Oslo blir borte. Ingen kan vite framtiden så sikkert.",
      tip:"Vær obs på skråsikre spådommer. Ekte forskning sier «kanskje» og «trolig»."}},
    {t:"Mange isbreer i Norge har blitt mindre."}]
  ],
  goals:[
   {fag:"Norsk etter 10. trinn (NOR01-08)", t:"bruke kilder på en kritisk måte, markere sitater og vise til kilder på en etterrettelig måte i egne tekster"},
   {fag:"Naturfag etter 10. trinn (NAT01-05)", t:"beskrive drivhuseffekten og gjøre rede for faktorer som kan være årsak til globale klimaendringer"},
   {fag:"Naturfag etter 10. trinn (NAT01-05)", t:"gi eksempler på dagsaktuell forskning og drøfte hvordan ny kunnskap genereres gjennom samarbeid og kritisk tilnærming til eksisterende kunnskap"}
  ],
  talk:["Hvilke feil fant dere med fagkunnskap, og hvilke fordi noe «luktet rart»?","Hvorfor er skråsikre spådommer vanskeligere å se enn feil tall?","Hvilke ord i en tekst bør få oss til å stoppe opp? («helt sikkert», «alle», «forskere er uenige» …)","Hvordan kan elevene bruke Copilot uten å bli lurt? Hva bør de alltid sjekke?"]
 }
};

const PROMPT=`Skriv en fagtekst på ca. 150 ord om [TEMA] for elever på [TRINN]. Skriv i en selvsikker tone, som en vanlig lærebok.

Legg inn 5 feil i teksten:
– 2 faktafeil
– 1 feil tall eller årstall
– 1 oppdiktet sitat fra en person som ikke finnes
– 1 påstand som høres sikker ut, men som ingen egentlig vet

Ikke vis hvor feilene er. Lag en fasit etter teksten: skriv hver feil, hva som er riktig og hvordan elevene kan sjekke det.`;

const st={screen:"start",lv:null,teams:1,cur:0,marks:newMarks(),time:0,running:false,active:null};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tick=null,audio=null;
const L=()=>LEVELS[st.lv];
const allS=()=>L().paras.flat().map((s,i)=>({...s,i}));
const errIdx=()=>allS().filter(s=>s.e).map(s=>s.i);
const tname=i=>st.teams===1?"Gruppa":`Lag ${i+1}`;

function steps(){document.querySelectorAll(".steps span").forEach(s=>s.classList.toggle("on",s.dataset.s===st.screen));}
function render(){stopRead();steps();({start:vStart,hunt:vHunt,reveal:vReveal})[st.screen]();}

/* --- start --- */
function vStart(){
  app.innerHTML=`
  <p class="eyebrow">Gruppeaktivitet · 15–20 min</p>
  <h1>Copilot svarer alltid selvsikkert. <em>Men har det rett?</em></h1>
  <p class="lede">Dere får et KI-svar med plantede feil. Klikk på setningene dere tror er feil før tiden renner ut. Etterpå avslører vi fasiten, med forklaring og tips til hvordan man kan oppdage feilen.</p>
  <div class="levels">${Object.entries(LEVELS).map(([k,l])=>`
    <button class="level" data-lv="${k}">
      <span class="eyebrow" style="margin:0">${l.grade} · ${l.fag}</span>
      <span class="big">${l.name}</span>
      <span class="meta">«${l.title}» · ${l.paras.flat().filter(s=>s.e).length} feil · ${l.minutes} min</span>
      <span class="legend">${l.types.map(t=>`<span class="tag c-${t}">${TYPES[t].label}</span>`).join("")}</span>
      <span class="go">Start dette nivået →</span>
    </button>`).join("")}</div>
  <div class="row" style="margin-bottom:22px"><span class="hint">Antall lag på skjermen:</span>
    ${[1,2,3,4,5,6].map(n=>`<button class="btn ${st.teams===n?"":"ghost"} small" data-teams="${n}" aria-pressed="${st.teams===n}">${n===1?"Hele gruppa":n+" lag"}</button>`).join("")}</div>

  <div class="why"><h3>Hvorfor gjør KI slike feil?</h3>
    <p>En språkmodell som Copilot slår ikke opp i et leksikon når den svarer. Den setter sammen ord som pleier å passe sammen. Det gjør at svaret nesten alltid <i>høres</i> riktig ut, også når det ikke er det. Navn, årstall og sitater kan bli diktet opp i farta.</p>
    <p>Derfor er kildekritikk ikke noe nytt vi må lære for KI. Det er det samme vi alltid har lært bort, bare enda viktigere.</p></div>

  <details class="guide"><summary>Kompetansemål i LK20</summary><div class="gb">
    ${Object.values(LEVELS).map(l=>`<h3 style="margin-top:8px">${l.name}: «${l.title}»</h3>${l.goals.map(g=>`<div class="km"><small>${g.fag}</small>${esc(g.t)}</div>`).join("")}`).join("")}
    <p class="hint">Fra læreplanene som gjelder fra 1. august 2026 (udir.no). Norskmålene er sjekket ordrett mot bokmålsteksten. Naturfagmålene er sjekket mot udir.no og gjengitt på bokmål.</p>
  </div></details>

  <details class="guide"><summary>Slik bruker du aktiviteten med egne elever</summary><div class="gb">
    <ol>
      <li><b>Kjør den som her.</b> Vis teksten på storskjerm, del klassen i to eller tre lag, og la lagene komme opp og klikke på sine setninger. Lagknappene øverst holder markeringene adskilt.</li>
      <li><b>Krev bevis.</b> Laget får bare poeng hvis de kan si hva som er riktig og hvor de fant det. Da øver elevene på å vise til kilder, ikke bare å gjette.</li>
      <li><b>Lag din egen tekst med Copilot.</b> Bruk prompten under og bytt ut tema og trinn. Sjekk fasiten selv før timen, for KI kan ta feil i fasiten også.</li>
      <li><b>La elevene plante feil.</b> På ungdomstrinnet kan lagene lage feil til hverandre. For å lage en lur feil må man kunne faget godt.</li>
    </ol>
    <p><b>Prompt til Copilot:</b></p>
    <div class="prompt" id="pr">${esc(PROMPT)}</div>
    <div class="row"><button class="btn small" id="copy">Kopier prompt</button><span class="hint" id="cm" aria-live="polite"></span></div>
  </div></details>`;
  app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>startLevel(b.dataset.lv));
  app.querySelectorAll("[data-teams]").forEach(b=>b.onclick=()=>{st.teams=+b.dataset.teams;render();});
  app.querySelector("#copy").onclick=()=>{const m=app.querySelector("#cm");
    const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("pr"));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent="Teksten er markert, trykk Ctrl+C";};
    try{navigator.clipboard.writeText(PROMPT).then(()=>m.textContent="Kopiert",sel);}catch(e){sel();}};
}
function startLevel(k){stopT();st.lv=k;st.marks=newMarks();st.cur=0;st.time=L().minutes*60;st.active=null;st.screen="hunt";render();scrollTo(0,0);}

/* --- jakt --- */
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function textHTML(mode){
  let i=-1; const errs=errIdx();
  return L().paras.map(p=>"<p>"+p.map(s=>{i++;
    if(mode==="hunt"){
      const who=[...Array(st.teams).keys()].filter(t=>st.marks[t].has(i));
      const mine=st.marks[st.cur].has(i);
      return `<span class="s${mine?" m":""}" style="--tc:${TEAMC[st.cur]}" data-i="${i}" role="button" tabindex="0" aria-pressed="${mine}">${esc(s.t)}${st.teams>1&&who.length?`<span class="flags" aria-hidden="true">${who.map(t=>`<i style="background:${TEAMC[t]}"></i>`).join("")}</span>`:""}</span>`;
    }
    const markedBy=[...Array(st.teams).keys()].filter(t=>st.marks[t].has(i));
    if(s.e){const n=errs.indexOf(i)+1;return `<span class="s e c-${s.e.type}${st.active===i?" active":""}" data-i="${i}" role="button" tabindex="0">${esc(s.t)}<sup class="n">${n}</sup></span>`;}
    return `<span class="s${markedBy.length?" fa":""}" data-i="${i}">${esc(s.t)}</span>`;
  }).join(" ")+"</p>").join("");
}
function vHunt(){
  const l=L(),C=2*Math.PI*52;
  app.innerHTML=`
  <div class="head"><div><p class="eyebrow">${l.name} · ${l.fag}</p><h2>${l.title}</h2>
    <p class="hint" style="margin:.4em 0 0">Klikk på setninger dere tror er feil. Klikk igjen for å fjerne markeringen. Det er ${errIdx().length} feil i teksten.</p></div>
    <div class="timer"><div class="ring" id="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="52"/><circle class="bar" id="bar" cx="60" cy="60" r="52" stroke-dasharray="${C}"/></svg><div class="num" id="num" role="timer">${fmt(st.time)}</div></div>
    <div class="ctrl"><button class="btn small" id="go">Start tid</button><button class="btn ghost small" id="plus">+1 min</button></div></div>
  </div>
  ${st.teams>1?`<div class="teams"><span class="lbl">Marker for</span>${[...Array(st.teams).keys()].map(t=>`<button class="tbtn" style="--tc:${TEAMC[t]}" data-t="${t}" aria-pressed="${st.cur===t}">${tname(t)} <span class="cnt">${st.marks[t].size}</span></button>`).join("")}</div>`:""}
  <div class="ttsrow"><button class="btn ghost small" id="tts" aria-pressed="false">Les opp teksten</button><span class="hint" id="ttsmsg" aria-live="polite"></span></div>
  <div class="ask">${esc(l.ask)}</div>
  <div class="answer" id="ans"><div class="who"><i></i>KI-svar</div>${textHTML("hunt")}</div>
  <div class="nextbtns"><button class="btn" id="rev">Avslør fasiten →</button><button class="btn ghost" id="back">Bytt nivå</button></div>`;
  updT();
  app.querySelector("#go").onclick=toggleT;
  app.querySelector("#tts").onclick=readAloud;
  app.querySelector("#plus").onclick=()=>{st.time+=60;updT();};
  app.querySelector("#rev").onclick=()=>{stopT();st.screen="reveal";render();scrollTo(0,0);};
  app.querySelector("#back").onclick=()=>{stopT();st.screen="start";render();};
  app.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>{st.cur=+b.dataset.t;refreshHunt();});
  bindSentences();
}
function bindSentences(){
  app.querySelectorAll("#ans .s").forEach(el=>{
    const f=()=>{const i=+el.dataset.i,m=st.marks[st.cur];m.has(i)?m.delete(i):m.add(i);refreshHunt();};
    el.onclick=f; el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f();}};
  });
}
function refreshHunt(){
  const a=document.getElementById("ans"); a.innerHTML=`<div class="who"><i></i>KI-svar</div>`+textHTML("hunt"); bindSentences(); markReading();
  app.querySelectorAll(".tbtn").forEach(b=>{const t=+b.dataset.t;b.setAttribute("aria-pressed",st.cur===t);b.querySelector(".cnt").textContent=st.marks[t].size;});
}
function updT(){
  const num=document.getElementById("num"),bar=document.getElementById("bar"),ring=document.getElementById("ring"); if(!num) return;
  const tot=L().minutes*60,C=2*Math.PI*52,f=Math.max(0,Math.min(1,st.time/Math.max(tot,st.time)));
  num.textContent=st.time>0?fmt(st.time):"Tiden!"; bar.style.strokeDashoffset=C*(1-f);
  ring.classList.toggle("low",st.time>0&&st.time<=30); ring.classList.toggle("done",st.time<=0);
  const go=document.getElementById("go"); if(go) go.textContent=st.running?"Pause":(st.time<=0?"Ferdig":"Start tid");
}
function toggleT(){
  if(st.time<=0) return;
  if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  st.running=!st.running;
  if(st.running) tick=setInterval(()=>{st.time--;if(st.time<=0){st.time=0;stopT();beep();}updT();},1000); else stopT();
  updT();
}
function stopT(){clearInterval(tick);tick=null;st.running=false;}
function beep(){if(!audio)return;try{[0,.25,.5].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.18,audio.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d+.2);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+.22);});}catch(e){}}

/* --- opplesing --- */
let speaking=false,readK=-1;
const hasTTS=()=>"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
function pickVoice(){try{const v=speechSynthesis.getVoices();return v.find(x=>/^nb/i.test(x.lang))||v.find(x=>/^(no|nn)/i.test(x.lang))||null;}catch(e){return null;}}
if(hasTTS()){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}catch(e){}}
function markReading(){document.querySelectorAll("#ans .s").forEach(x=>x.classList.toggle("reading",speaking&&+x.dataset.i===readK));}
function ttsBtn(){const b=document.getElementById("tts");if(!b)return;b.textContent=speaking?"Stopp opplesing":"Les opp teksten";b.setAttribute("aria-pressed",speaking);}
function readAloud(){
  const msg=document.getElementById("ttsmsg");
  if(!hasTTS()){if(msg)msg.textContent="Nettleseren støtter ikke opplesing.";return;}
  if(speaking){stopRead();return;}
  const sents=allS(),v=pickVoice();
  if(msg)msg.textContent=v?"":"Fant ingen norsk stemme på denne maskinen, så uttalen kan bli rar.";
  speechSynthesis.cancel(); speaking=true; readK=0; ttsBtn();
  const next=()=>{
    if(!speaking)return;
    if(readK>=sents.length){stopRead();return;}
    markReading();
    const u=new SpeechSynthesisUtterance(sents[readK].t);
    u.lang=v?v.lang:"nb-NO"; if(v)u.voice=v; u.rate=0.9;
    u.onend=()=>{if(!speaking)return;readK++;next();};
    u.onerror=()=>{if(speaking)stopRead();};
    speechSynthesis.speak(u);
  };
  next();
}
function stopRead(){speaking=false;readK=-1;try{if(hasTTS())speechSynthesis.cancel();}catch(e){}markReading();ttsBtn();}

/* --- avsløring --- */
function vReveal(){
  const l=L(),S=allS(),errs=errIdx();
  const res=[...Array(st.teams).keys()].map(t=>({t,found:errs.filter(i=>st.marks[t].has(i)).length,fa:[...st.marks[t]].filter(i=>!S[i].e).length}));
  const anyFa=S.some(s=>!s.e&&res.some(r=>st.marks[r.t].has(s.i)));
  app.innerHTML=`
  <div class="head"><div><p class="eyebrow">Avsløring · ${l.name}</p><h2>${l.title}</h2>
    <p class="hint" style="margin:.4em 0 0">Klikk på en markert setning for å hoppe til forklaringen.</p></div>
    <div class="legend">${l.types.map(t=>`<span class="tag c-${t}">${TYPES[t].label}</span>`).join("")}</div></div>
  <div class="result">${res.map(r=>`<div class="res" style="--tc:${TEAMC[r.t]}"><b>${tname(r.t)}</b><div class="big">${r.found}/${errs.length}</div><span>feil funnet${r.fa?` · ${r.fa} falsk${r.fa===1?"":"e"} alarm${r.fa===1?"":"er"}`:""}</span></div>`).join("")}</div>
  <div class="answer reveal" id="ans"><div class="who"><i></i>KI-svar med fasit</div>${textHTML("reveal")}</div>
  ${anyFa?`<div class="fa-note">Setninger med prikket gjennomstreking ble markert, men stemmer faktisk. Det er helt greit å være skeptisk. Det viktige er å sjekke.</div>`:""}
  <div class="cards">${errs.map((i,k)=>{const e=S[i].e;return `
    <article class="card c-${e.type}${st.active===i?" active":""}" id="c${i}">
      <div class="h"><span class="n">${k+1}</span><span class="tag c-${e.type}">${TYPES[e.type].label}</span></div>
      <p>${esc(e.why)}</p>
      <p class="tip"><b>Slik kunne dere oppdaget den:</b> ${esc(e.tip)}</p>
      <div class="who2">${[...Array(st.teams).keys()].map(t=>`<span class="pill${st.marks[t].has(i)?"":" miss"}" style="--tc:${TEAMC[t]}">${tname(t)}${st.marks[t].has(i)?" fant den":""}</span>`).join("")}</div>
    </article>`;}).join("")}</div>
  <div class="talk"><h2>Snakk sammen</h2><ol>${l.talk.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>
  <div class="nextbtns"><button class="btn" id="other">Prøv ${st.lv==="mellom"?"ungdomsskolenivået":"mellomtrinnsnivået"} →</button><button class="btn ghost" id="again">Spill samme nivå på nytt</button><button class="btn ghost" id="home">Til start</button></div>`;
  app.querySelectorAll("#ans .s.e").forEach(el=>{
    const f=()=>{st.active=+el.dataset.i;app.querySelectorAll("#ans .s.e").forEach(x=>x.classList.toggle("active",x===el));app.querySelectorAll(".card").forEach(c=>c.classList.toggle("active",c.id==="c"+el.dataset.i));
      document.getElementById("c"+el.dataset.i).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"center"});};
    el.onclick=f; el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f();}};
  });
  app.querySelector("#other").onclick=()=>startLevel(st.lv==="mellom"?"ungdom":"mellom");
  app.querySelector("#again").onclick=()=>startLevel(st.lv);
  app.querySelector("#home").onclick=()=>{st.screen="start";render();scrollTo(0,0);};
}
document.addEventListener("keydown",e=>{if(st.screen==="hunt"&&e.code==="Space"&&document.activeElement===document.body){e.preventDefault();toggleT();}});
render();
})();
</script>

</body></html>
